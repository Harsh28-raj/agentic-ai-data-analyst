services:
  - type: web
    name: datamind-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1

      - key: MODEL_NAME
        value: llama-3.3-70b-versatile

      - key: LOG_LEVEL
        value: INFO
